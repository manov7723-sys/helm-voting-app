apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote
  namespace: {{ .Values.vote.namespace }}
  labels:
    app: {{ .Values.vote.labels.app }}
spec:
  replicas: {{ .Values.vote.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.vote.labels.app }}
  template:
    metadata:
      labels:
        app: {{ .Values.vote.labels.app }}
    spec:
      containers:
      - name: vote
        image: {{ .Values.vote.image }}
        ports:
        - containerPort: {{ .Values.vote.port }}
          name: vote
