apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: {{ .Values.worker.namespace }}
  labels:
    app: {{ .Values.worker.labels.app }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.worker.labels.app }}
  template:
    metadata:
      labels:
        app: {{ .Values.worker.labels.app }}
    spec:
      containers:
      - name: worker
        image: {{ .Values.worker.image }}
        env:
        - name: REDIS_HOST
          value: {{ .Values.worker.env.redisHost }}
        - name: DB_HOST
          value: {{ .Values.worker.env.dbHost }}